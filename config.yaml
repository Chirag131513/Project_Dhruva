# Project Dhruva — pre-registered configuration.
#
# Constants in the `frozen` section correspond to PROTOCOL sections 02, 05, 07, 10 and 12.
# They are AMENDMENT-ONLY: once block0 has been committed, do not edit in place.
# To change one, append to `amendments` with a timestamp and reason, and re-run block0.
#
# Rationale for freezing: choosing gamma, the cost constants or the success thresholds
# AFTER seeing results is how an experiment is made to guarantee its own conclusion.

frozen:

  # --- PROTOCOL 07 : conformal ---------------------------------------------
  alpha: 0.10              # target miscoverage -> 90% coverage per cell
  gamma: 0.01              # ACI step size. Declared a priori.
  gamma_sensitivity: [0.005, 0.01, 0.05]   # reported as a band, never as a substitute headline

  # --- PROTOCOL 05 : signal-degradation transform tau ------------------------
  kappa: 0.5               # timing-compression coefficient on block D
  rho_sweep:    [0.0, 0.1, 0.2, 0.4, 0.6, 0.8]
  lambda_sweep: [0.0, 0.25, 0.5, 0.75, 1.0]
  lambda_headline: 0.75    # severity used for the rho-sweep figures

  # --- PROTOCOL 10 : cost model (INR) ---------------------------------------
  fee_chargeback: 1500.0   # dispute handling fee per chargeback
  margin: 0.25             # contribution margin on a legitimate order
  goodwill: 250.0          # friction cost of blocking a good customer
  review_cost: 40.0        # ~4 min analyst time
  human_error_rate: 0.05   # assumed analyst error. Declared, not measured.
  review_cap_sweep: [0.01, 0.02, 0.05]
  review_cap_headline: 0.02
  cost_sensitivity_pct: 0.5   # +/-50% sweep on fee_chargeback, margin, review_cost

  # --- PROTOCOL 06 : splits -------------------------------------------------
  train_frac: 0.60
  cal_frac:   0.15
  test_frac:  0.25
  delay_days: 7            # verification latency. Rows in this window are DROPPED.

  # --- PROTOCOL 12 : stop rules & success criteria --------------------------
  min_cell_n: 100          # below this, per-cell coverage is NOT reported
  n_seeds: 10
  underpowered_note: "n=10 paired seeds; min achievable two-sided p ~= 0.002"

  # --- experiment control ---------------------------------------------------
  base_seed: 20260820
  target_coverage_band: 0.02   # +/- band around nominal counted as "in band"

# Not frozen: engineering choices that cannot bias a hypothesis test.
tuning:
  lgbm:
    objective: binary
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 64
    min_child_samples: 50
    subsample: 0.9
    subsample_freq: 1
    colsample_bytree: 0.8
    verbosity: -1

paths:
  data_dir: data
  results_dir: results

amendments: []
