# Project Dhruva — pre-registered configuration.
#
# Constants in the `frozen` section correspond to PROTOCOL sections 02, 05, 07, 10 and 12.
# They are AMENDMENT-ONLY: once block0 has been committed, do not edit in place.
# To change one, append to `amendments` with a timestamp and reason, and re-run block0.
#
# Rationale for freezing: choosing gamma, the cost constants or the success thresholds
# AFTER seeing results is how an experiment is made to guarantee its own conclusion.

frozen:

  # --- PROTOCOL 07 : conformal ---------------------------------------------
  alpha: 0.10              # target miscoverage -> 90% coverage per cell
                           # PRE-REGISTERED. Unchanged. Amendment 1 adds a
                           # second arm; it does NOT replace this value, and
                           # both are reported side by side.

  # --- AMENDMENT 1 (2026-08-20) : capacity-derived per-class alpha ----------
  # Added AFTER Block 4 showed the pre-registered alpha loses money. Recorded
  # here rather than edited in place, because changing a frozen constant to
  # improve a result you have already seen is the failure the freeze exists
  # to prevent.
  #
  # DERIVED, NOT TUNED. alpha_legit is not a free parameter: miscovering a
  # legitimate row pushes it toward block-or-review, so the miscoverage
  # budget on the majority class is bounded by the review capacity that can
  # actually be staffed:
  #
  #     alpha_legit = review_cap_headline / P(legit)
  #
  # At 2% capacity and ~96.6% legitimate traffic that is ~0.021. alpha_fraud
  # stays at the pre-registered 0.10 -- the fraud-side promise is the one we
  # actually wanted, and nothing observed justifies loosening it.
  #
  # The direction is counter-intuitive and worth stating: fraud is the
  # expensive error per case, but legitimate traffic is 28x more common, so
  # in AGGREGATE the miscoverage budget belongs mostly to the fraud class.
  amendment1_enabled: true
  amendment1_alpha_fraud: 0.10        # unchanged from pre-registration
  amendment1_alpha_legit_source: capacity   # = review_cap_headline / P(legit)
  gamma: 0.01              # ACI step size. Declared a priori.
  gamma_sensitivity: [0.005, 0.01, 0.05]   # reported as a band, never as a substitute headline

  # --- PROTOCOL 05 : signal-degradation transform tau ------------------------
  kappa: 0.5               # timing-compression coefficient on block D
  rho_sweep:    [0.0, 0.1, 0.2, 0.4, 0.6, 0.8]
  lambda_sweep: [0.0, 0.25, 0.5, 0.75, 1.0]
  lambda_headline: 0.75    # severity used for the rho-sweep figures

  # --- PROTOCOL 10 : cost model (INR) ---------------------------------------
  fee_chargeback: 1500.0   # dispute handling fee per chargeback
  margin: 0.25             # contribution margin on a legitimate order
  goodwill: 250.0          # friction cost of blocking a good customer
  review_cost: 40.0        # ~4 min analyst time
  human_error_rate: 0.05   # assumed analyst error. Declared, not measured.
  review_cap_sweep: [0.01, 0.02, 0.05]
  review_cap_headline: 0.02
  cost_sensitivity_pct: 0.5   # +/-50% sweep on fee_chargeback, margin, review_cost

  # --- PROTOCOL 06 : splits -------------------------------------------------
  train_frac: 0.60
  cal_frac:   0.15
  test_frac:  0.25
  delay_days: 7            # verification latency. Rows in this window are DROPPED.

  # --- PROTOCOL 12 : stop rules & success criteria --------------------------
  min_cell_n: 100          # below this, per-cell coverage is NOT reported
  n_seeds: 10
  underpowered_note: "n=10 paired seeds; min achievable two-sided p ~= 0.002"

  # --- experiment control ---------------------------------------------------
  base_seed: 20260820
  target_coverage_band: 0.02   # +/- band around nominal counted as "in band"

# Not frozen: engineering choices that cannot bias a hypothesis test.
tuning:
  lgbm:
    objective: binary
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 64
    min_child_samples: 50
    subsample: 0.9
    subsample_freq: 1
    colsample_bytree: 0.8
    verbosity: -1

paths:
  data_dir: C:/Users/Chirag V Rao/dhruva-data
  results_dir: results

amendments:
  - id: 1
    date: 2026-08-20
    section: PROTOCOL 07
    title: Capacity-derived per-class alpha
    reason: >
      Block 4 refuted H4: at the pre-registered alpha = 0.10 the population-conditional arm
      cost Rs1,530,135 more than the plain per-transaction Bayes threshold, because targeting
      90% coverage of the legitimate class excludes 10% of legitimate traffic by construction
      (FPR 11.15% against the baseline's 1.85%). The failure is structural, not a tuning
      accident: a symmetric miscoverage budget applied to a 28:1 imbalanced, cost-asymmetric
      problem allocates almost the whole budget to the class that can least afford it.
    change: >
      Adds an arm in which alpha is per-class. alpha_legit is derived from the frozen review
      capacity as review_cap_headline / P(legit); alpha_fraud remains the pre-registered 0.10.
      No pre-registered value is modified.
    reported_as: >
      A separate arm. The alpha = 0.10 result stands and is reported alongside it. The amended
      arm is post-hoc and is labelled as such wherever it appears.
    prediction: >
      Stated before running: FPR should fall toward the capacity bound and total cost should
      drop. If cost does NOT drop, the amendment is reported as a further refutation and the
      conclusion becomes that conformal abstention is the wrong tool for this problem at any
      alpha, not merely at 0.10.
